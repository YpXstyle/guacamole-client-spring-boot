<div class="guac-file-upload">

    <!-- Preview with hover-overlay remove -->
    <div class="file-preview" ng-show="currentUrl">
        <img ng-src="{{currentUrl}}" alt="Preview" class="preview-image">
        <div class="preview-overlay">
            <button class="remove-button" ng-click="removeFile()"
                    ng-disabled="removing">&#10005;</button>
        </div>
    </div>

    <!-- Upload area -->
    <div class="upload-area" ng-hide="uploading">
        <label class="upload-button">
            <span class="upload-icon">&#128193;</span>
            <span class="upload-label" ng-show="!currentUrl">{{'SETTINGS.ACTION_UPLOAD' | translate}}</span>
            <span class="upload-label" ng-show="currentUrl">{{'SETTINGS.ACTION_REPLACE' | translate}}</span>
            <input type="file" accept="image/*" class="file-input">
        </label>
        <span class="file-hint" ng-show="!currentUrl">{{'SETTINGS.FILE_UPLOAD_HINT' | translate}}</span>
    </div>

    <!-- Uploading indicator -->
    <div class="upload-loading" ng-show="uploading">
        <span class="spinner"></span>
        <span>{{'SETTINGS.ACTION_UPLOADING' | translate}}...</span>
    </div>

    <!-- Removing indicator -->
    <div class="upload-loading" ng-show="removing">
        <span>{{'SETTINGS.ACTION_DELETING' | translate}}...</span>
    </div>

</div>
