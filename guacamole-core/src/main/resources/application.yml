server:
  port: 8080

guacamole:
  guacd:
    hostname: localhost
    port: 4822
    ssl: false

  # Authentication extensions (enable via Maven dependency + set to true)
  auth:
    header:
      enabled: true
    duo:
      enabled: false
    json:
      enabled: true
    ldap:
      enabled: false
      ldap-hostname: ldap.forumsys.com
      ldap-port: 389
      ldap-user-base-dn: dc=example,dc=com
      ldap-username-attribute: uid
    totp:
      enabled: false
    radius:
      enabled: false
    quickconnect:
      enabled: true
    mysql:
      enabled: false
    postgresql:
      enabled: false
    sqlserver:
      enabled: false
    # CAS 单点登录配置
    sso-cas:
      enabled: true
      cas-authorization-endpoint: https://cas.example.org/cas
      cas-redirect-uri: http://localhost:8080/

    # OpenID Connect 配置 (Google)
    # 需要在 Google Cloud Console 创建 OAuth 2.0 凭据
    # https://console.cloud.google.com/apis/credentials
    sso-openid:
      enabled: false
      openid-authorization-endpoint: https://accounts.google.com/o/oauth2/v2/auth
      openid-jwks-endpoint: https://www.googleapis.com/oauth2/v3/certs
      openid-issuer: https://accounts.google.com
      openid-client-id: ${OPENID_CLIENT_ID:your-client-id-here}
      openid-redirect-uri: http://localhost:8080/
      openid-scope: openid email profile
      openid-username-claim-type: email
      openid-groups-claim-type: groups

    # SAML 单点登录配置 (示例)
    # 需要真实的 SAML IdP 配置
    sso-saml:
      enabled: false
      saml-callback-url: http://localhost:8080/
      saml-idp-url: https://idp.example.com/sso
      saml-entity-id: http://localhost:8080/
      saml-strict: false
      saml-debug: true

  vault:
    ksm:
      enabled: false

# History configuration 录像名配置为：${HISTORY_UUID}
  history:
    enabled: true
    recording-search-path: /tmp/guacamole/recordings

spring:
  datasource:
    url: jdbc:postgresql://192.168.5.188:5432/guacamole
    username: guacamole
    password: guacamole
    driver-class-name: org.postgresql.Driver
  main:
    banner-mode: "off"
  jackson:
    serialization:
      write-dates-as-timestamps: true

logging:
  level:
    org.apache.guacamole.history: info